<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="jelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="#0c0b0e"/>
  <!-- purple shadow, offset so the blob looks like it is sitting and slumping -->
  <ellipse cx="256" cy="428" rx="170" ry="26" fill="#9b6bff" opacity=".85"/>
  <!-- squished jelly body: wider than tall, heavier at the bottom -->
  <path d="M256 92 C 372 92 440 160 440 262 C 440 352 396 412 256 412 C 116 412 72 352 72 262 C 72 160 140 92 256 92 Z" fill="url(#jelly)"/>
  <!-- highlight -->
  <path d="M138 196 C 150 150 196 124 240 120" fill="none" stroke="#ffd2a1" stroke-width="22" stroke-linecap="round" opacity=".75"/>
  <!-- the S -->
  <path d="M322 196 C 322 150 188 150 188 214 C 188 276 324 252 324 316 C 324 374 186 372 186 322"
        fill="none" stroke="#0c0b0e" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
